server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location /en/ {
    error_page 404 /en/404.html;
    try_files $uri $uri/ =404;
  }

  location = /config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  error_page 404 /404.html;
}
